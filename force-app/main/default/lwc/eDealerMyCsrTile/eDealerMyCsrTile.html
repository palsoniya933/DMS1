<template>
    <div class="slds-card tile">
        <!-- spinner -->
        <template if:true={displayLoading}>
            <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
        </template>

        <div class="slds-card__body slds-card__body_inner">
                <!-- Grid -->
                <template lwc:if={csrData}>
                <div class="slds-grid gridHeight">
                    <div class="slds-col slds-size_7-of-8">
                        <!-- Tile Name -->
                        <div class="tileName_Div">
                            <span class="heading">
                                <template if:true={enableSamePageListing}>
                                    <a href="javascript:void(0);" onclick={openCsrListing}>{title}</a>
                                </template>
                                <template if:false={enableSamePageListing}>
                                    {title}
                                </template>
                            </span>

                            &nbsp;&nbsp;

                            <template if:true={hasDealerLoc}>
                                <span onclick={handleOpenInNewWindow}>
                                    <a href="javascript:void(0);">
                                        <img src="/resource/1648782488000/EDealerResources/icons/opentabicon.svg#opentabicon" class="imgicon-style-align"/>
                                    </a>
                                </span>
                            </template>
                        </div>

                        <div class="top_Margin">
                            <table>
                                <tr>
                                        <td>
                                            <div class="draft-csr-type">
                                                <lightning-formatted-text
                                                value={MyCsrValue}
                                                options={MyCSROptions}>
                                            </lightning-formatted-text>
    
                                            </div>
                                            
                                        </td>
                                </tr>
                                <tr>
                                        <td class="tileInfo_Div">
                                            <span >
                                                <template lwc:if={hasDealerLoc}>
                                                    <lightning-formatted-number class="greenTextb" style="top: 3%;" value={draftcsrcount} onclick={handleOpenInNewWindow}></lightning-formatted-number>
                                                </template>
                                                <template lwc:else>
                                                    <lightning-formatted-number  class="greenTextbNP" style="top: 3%;" value={draftcsrcount}></lightning-formatted-number>
                                                </template>    
                                            </span>
                                        </td>
                                    
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            </template>
                <template lwc:if={error}>
                    <div class="info-msg slds-align_absolute-center .padding-bt">
                        <lightning-icon 
                        icon-name="utility:warning" 
                        alternative-text="checked" 
                        size="xx-small" 
                        title=""
                        class="my-icon"
                        ></lightning-icon>{Edealer_My_CSR_Tile_ErrorMsg}
                    </div>
                </template>
        </div>
         <!-- information icon -->
         <div class="infoIconPosition">
                                <c-e-dealer-info-icon content={Edealer_My_CSR_Tile_Help}></c-e-dealer-info-icon>
        </div>
        
    </div>
</template>
