<template>

	<lightning-spinner lwc:if={isLoading} alternative-text="Loading" size="medium" variant="brand" class="centered-alert"></lightning-spinner>
		<template if:false={isLoading}>
			<template lwc:if={hasfilesOrPostingLetter}>
				<table
					class="slds-table slds-table_cell-buffer slds-no-row-hover slds-table_bordered slds-p-top_medium slds-p-left_small slds-p-right_medium">
					<thead>
						<tr class="slds-line-height_reset">
							<template for:each={columnLabelByApiName} for:item="columnName" for:index="index">
								<th key={columnName.label} scope="col" class="heading">{columnName.label}</th>
							</template>
						</tr>
					</thead>
					<tbody>
						<template for:each={csrFiles} for:item="file" for:index="index">
							<tr class="slds-hint-parent" key={file.Key}>
								<td class="data">
									<div class="slds-truncate">
										<p><a href={file.Fileurl} target="_blank">{file.Key}</a></p>
									</div>
								</td>
								<td class="data">
									<div class="slds-truncate">
										<p>{file.type}</p>
									</div>
								</td>
							</tr>
						</template>
						<template for:each={csrPostingLetters} for:item="letter" for:index="index">
							<tr class="slds-hint-parent" key={letter.Key}>
								<td class="data">
									<div class="slds-truncate">
										<p><a href={letter.Fileurl} target="_blank">{letter.label}</a></p>
									</div>
									
								</td>
								<td>
									<div class="slds-truncate">
										<p>{letter.type}</p>
									</div>
								</td>
							</tr>
						</template>
					</tbody>
				</table>
			</template>
		
	
		<template if:true={showError}>
			<c-edealer-no-record-found-lwc message="No files found">
			</c-edealer-no-record-found-lwc>
		</template>
	</template>
</template>
