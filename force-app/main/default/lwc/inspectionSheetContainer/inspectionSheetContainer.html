<template>
    <lightning-card title="Inspection Sheet (s)" class="slds-p-right_medium">
        <template if:true={showSpinner}>
            <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
        </template>
        <template if:true={isAdminUser}>
            <div class="button-container">
                <lightning-button variant="success" class="upload-btn slds-m-right_large" label="Upload"
                    icon-name="utility:upload" onclick={handleModalVisibility}></lightning-button>
            </div>
        </template>
        <template if:true={inspectionSheets}>
            <div class="width80">
                <c-inspection-sheet-listing inspection-sheets={inspectionSheets} is-admin-user={isAdminUser}
                    ondeletedocument={deleteDocument}></c-inspection-sheet-listing>
            </div>
        </template>

        <template if:true={isModalVisible}>
            <c-inspection-sheet-upload-modal existing-file-ids={existingFileIds} onclosemodal={handleModalVisibility}
                onfileuploaded={handleFileUploaded}></c-inspection-sheet-upload-modal>
        </template>
    </lightning-card>
</template>
