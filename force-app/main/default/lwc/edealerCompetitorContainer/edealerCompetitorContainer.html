<template>
    <lightning-card variant="Narrow">
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header slds-modal__header_empty">
                    <div class="slds-m-around_x-small">
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-size_5-of-12">
                                <span>
                                    <div class="prodnameno slds-truncate align-partname">
                                        <h2 class="slds-text-heading_medium">
                                            {label.EDealer_Choose_Competitor}
                                        </h2>
                                    </div>
                                </span>
                            </div>
                            <div class="padd-right">
                                <button onclick={handleCloseCompetitorModal}
                                    class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse">
                                    <lightning-icon icon-name="utility:close" size="small" class="fill-color"></lightning-icon>
                                </button>
                            </div>
                        </div>
                    </div>
                </header>
                <div class="slds-modal__content">
                    <lightning-tabset active-tab-value={activeTab}>
                        <lightning-tab label={label.EDealer_Choose_Competitor} value = "chooseCompetitor">
                           
                            <c-edealer-choose-competitor
                                oncancelmodal={handleCancelEvent}
                                onselectedcompetitor={handleSelectedRowData}
                                selected-part={selectedPart}
                                selected-comp-id={selectedCompId}
                                dealer-code = {dealerCode}
                               add-competitor-form-data={selectedCompetitorData}
                            >
                            </c-edealer-choose-competitor>
                        </lightning-tab>
                    </lightning-tabset>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </lightning-card>
</template>
