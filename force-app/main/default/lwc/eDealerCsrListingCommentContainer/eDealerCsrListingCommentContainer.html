<template>
    
	<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
		aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
       
		<div class="slds-modal__container">
            <header class="slds-modal__header slds-modal__header_empty">
				<div class="slds-m-around_x-small">
					<div class="slds-grid slds-wrap">
						
                        <div class="button-container">
                            <button  onclick={handleclosemodal} class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse">
                            <lightning-icon icon-name="utility:close"  size="small" class="fill-color"></lightning-icon>  
                        </button>
                        </div>
					</div>
				</div>
			</header>
           
			<div class="slds-modal__content">
                <c-edealer-csr-view-comment csr-number={csrnumber} phase={phase}></c-edealer-csr-view-comment>
            </div>
        </div>
	</section>
	<div class="slds-backdrop slds-backdrop_open"></div>

</template>
